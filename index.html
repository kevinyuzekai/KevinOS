<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b1020" />
<title>KevinOS</title>
<meta name="description" content="KevinOS · 一个运行在浏览器里的桌面操作系统，内置浏览器、文件管理器与全套原生应用。" />
<link rel="icon" href="assets/logo.png" />
<link rel="stylesheet" href="css/reset.css" />
<link rel="stylesheet" href="css/theme.css" />
<link rel="stylesheet" href="css/desktop.css" />
<link rel="stylesheet" href="css/window.css" />
<link rel="stylesheet" href="css/apps.css" />
</head>
<body class="booting">

<!-- ================= 开机动画 ================= -->
<div id="boot-screen" class="boot-screen">
  <div class="boot-inner">
    <div class="boot-logo-wrap">
      <img src="assets/logo.png" alt="KevinOS" class="boot-logo" />
      <div class="boot-ring"></div>
    </div>
    <div class="boot-title">KevinOS</div>
    <div class="boot-sub">A Web Operating System</div>
    <div class="boot-progress"><div class="boot-progress-bar" id="boot-bar"></div></div>
    <div class="boot-status" id="boot-status">正在初始化内核…</div>
  </div>
</div>

<!-- ================= 桌面 ================= -->
<div id="desktop" class="desktop" hidden>
  <div class="wallpaper" id="wallpaper"></div>
  <div class="wallpaper-overlay"></div>

  <!-- 桌面图标层 -->
  <div class="desktop-icons" id="desktop-icons"></div>

  <!-- 窗口层 -->
  <div class="windows-layer" id="windows-layer"></div>

  <!-- 窗口拖拽/缩放时的预览遮罩 -->
  <div class="snap-preview" id="snap-preview" hidden></div>

  <!-- ================= 任务栏 ================= -->
  <div class="taskbar" id="taskbar">
    <button class="start-btn" id="start-btn" title="开始">
      <img src="assets/logo.png" alt="" />
    </button>

    <button class="taskbar-btn" id="launchpad-btn" title="启动台">
      <svg viewBox="0 0 24 24" class="ico"><path d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z"/></svg>
    </button>

    <div class="taskbar-search" id="taskbar-search">
      <svg viewBox="0 0 24 24" class="ico"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
      <input type="text" id="global-search" placeholder="搜索应用、文件与命令…" autocomplete="off" spellcheck="false" />
    </div>

    <div class="taskbar-apps" id="taskbar-apps"></div>

    <div class="taskbar-tray" id="taskbar-tray">
      <div class="tray-items">
        <button class="tray-btn" id="tray-wifi" title="网络">
          <svg viewBox="0 0 24 24" class="ico"><path d="M12 3C7.5 3 3.5 4.7.6 7.6l1.4 1.4C4.7 6.5 8.2 5 12 5s7.3 1.5 10 4l1.4-1.4C20.5 4.7 16.5 3 12 3zm0 4c-3 0-5.7 1.1-7.8 3l1.4 1.4C7.2 9.8 9.5 9 12 9s4.8.8 6.4 2.4l1.4-1.4C17.7 8.1 15 7 12 7zm0 4c-1.7 0-3.2.6-4.4 1.7l1.4 1.4c.8-.7 1.9-1.1 3-1.1s2.2.4 3 1.1l1.4-1.4C15.2 11.6 13.7 11 12 11zm0 4a2 2 0 0 0-1.4 3.4l1.4 1.6 1.4-1.6A2 2 0 0 0 12 15z"/></svg>
        </button>
        <button class="tray-btn" id="tray-volume" title="音量">
          <svg viewBox="0 0 24 24" class="ico"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a3.5 3.5 0 0 0-2-3.2v6.4a3.5 3.5 0 0 0 2-3.2zm2 0a5.5 5.5 0 0 1-3 4.9l.9 2A7.5 7.5 0 0 0 20 12a7.5 7.5 0 0 0-3.6-6.3l-.9 2A5.5 5.5 0 0 1 18.5 12z"/></svg>
        </button>
      </div>
      <button class="tray-clock" id="tray-clock">
        <span class="clock-time" id="clock-time">--:--</span>
        <span class="clock-date" id="clock-date">-------</span>
      </button>
      <button class="tray-btn tray-notif" id="tray-notif" title="通知">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22zm7-6v-5a7 7 0 0 0-5-6.7V4a2 2 0 1 0-4 0v.3A7 7 0 0 0 5 11v5l-1.7 1.7A1 1 0 0 0 4 19.4h16a1 1 0 0 0 .7-1.7L19 16z"/></svg>
        <span class="notif-badge" id="notif-badge" hidden>0</span>
      </button>
    </div>
  </div>

  <!-- ================= 开始菜单 ================= -->
  <div class="start-menu" id="start-menu" hidden>
    <div class="start-menu-head">
      <img src="assets/logo.png" alt="" class="start-logo" />
      <div>
        <div class="start-user">Kevin</div>
        <div class="start-hello">欢迎使用 KevinOS</div>
      </div>
    </div>
    <div class="start-search-wrap">
      <input type="text" id="start-search" placeholder="输入以搜索…" autocomplete="off" />
    </div>
    <div class="start-section-title"><span>已固定</span><button class="link-btn" id="start-all-apps">全部应用 ›</button></div>
    <div class="start-apps" id="start-apps"></div>
    <div class="start-recent" id="start-recent"></div>
    <div class="start-foot">
      <button class="start-foot-btn" data-open-app="files">
        <svg viewBox="0 0 24 24" class="ico"><path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></svg>
        文件
      </button>
      <button class="start-foot-btn" data-open-app="settings">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9 4c0-.6-.1-1.2-.2-1.8l2-1.5-2-3.4-2.3 1a7 7 0 0 0-3-1.7L15 2H9l-.5 2.6a7 7 0 0 0-3 1.7l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3.6l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 3 1.7L9 22h6l.5-2.6a7 7 0 0 0 3-1.7l2.3 1 2-3.4-2-1.5c.1-.6.2-1.2.2-1.8z"/></svg>
        设置
      </button>
      <div class="spacer"></div>
      <button class="start-power" id="start-power" title="关机 / 重启">
        <svg viewBox="0 0 24 24" class="ico"><path d="M11 3h2v9h-2V3zm5.7 1.3 1.4 1.4A8 8 0 1 1 6 5.7l1.4-1.4A6 6 0 1 0 16.7 4.3z"/></svg>
      </button>
    </div>
  </div>

  <!-- ================= 快捷设置 / 通知中心 ================= -->
  <div class="action-center" id="action-center" hidden>
    <div class="ac-toggles" id="ac-toggles"></div>
    <div class="ac-sliders">
      <div class="ac-slider-row">
        <svg viewBox="0 0 24 24" class="ico"><path d="M12 5v14a7 7 0 0 0 0-14z"/></svg>
        <input type="range" id="ac-brightness" min="30" max="100" value="100" />
      </div>
      <div class="ac-slider-row">
        <svg viewBox="0 0 24 24" class="ico"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a3.5 3.5 0 0 0-2-3.2v6.4a3.5 3.5 0 0 0 2-3.2z"/></svg>
        <input type="range" id="ac-volume" min="0" max="100" value="60" />
      </div>
    </div>
    <div class="ac-notifs-head"><span>通知</span><button class="link-btn" id="clear-notifs">全部清除</button></div>
    <div class="ac-notifs" id="ac-notifs"></div>
  </div>

  <!-- ================= 启动台 ================= -->
  <div class="launchpad" id="launchpad" hidden>
    <div class="lp-bg" id="lp-bg"></div>
    <div class="lp-inner">
      <div class="lp-search-wrap">
        <svg viewBox="0 0 24 24" class="ico"><path d="M10 4a6 6 0 1 0 3.9 10.6l4.7 4.7 1.4-1.4-4.7-4.7A6 6 0 0 0 10 4zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/></svg>
        <input type="text" id="lp-search" placeholder="搜索" autocomplete="off" spellcheck="false" />
      </div>
      <div class="lp-viewport" id="lp-viewport">
        <div class="lp-track" id="lp-track"></div>
      </div>
      <div class="lp-pages" id="lp-pages"></div>
    </div>
  </div>

  <!-- ================= 右键菜单 ================= -->
  <div class="context-menu" id="context-menu" hidden></div>

  <!-- ================= 通知气泡容器 ================= -->
  <div class="toast-stack" id="toast-stack"></div>

  <!-- ================= 操作提示 ================= -->
  <div class="osd" id="osd" hidden><span id="osd-text"></span></div>
</div>

<!-- 脚本 -->
<script src="js/core/fs.js"></script>
<script src="js/core/registry.js"></script>
<script src="js/core/window.js"></script>
<script src="js/apps/browser.js"></script>
<script src="js/apps/files.js"></script>
<script src="js/apps/terminal.js"></script>
<script src="js/apps/editor.js"></script>
<script src="js/apps/calculator.js"></script>
<script src="js/apps/photos.js"></script>
<script src="js/apps/media.js"></script>
<script src="js/apps/calendar.js"></script>
<script src="js/apps/notes.js"></script>
<script src="js/apps/settings.js"></script>
<script src="js/apps/about.js"></script>
<script src="js/apps/store.js"></script>
<script src="js/apps/weather.js"></script>
<script src="js/apps/code.js"></script>
<script src="js/core/desktop.js"></script>
<script src="js/core/system.js"></script>
</body>
</html>
